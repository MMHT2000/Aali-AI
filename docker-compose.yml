services:
  mysql:
    image: mysql:8.4
    container_name: aali-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${AALI_DB_NAME:-aali_ai}
      MYSQL_USER: ${AALI_DB_USER:-aali_dev}
      MYSQL_PASSWORD: ${AALI_DB_PASSWORD:-aali-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${AALI_DB_ROOT_PASSWORD:-aali-local-root-password}
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - aali_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aali-ai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      API_PORT: 3001
      API_PUBLIC_URL: http://localhost:${AALI_API_PORT:-3002}
      WEB_ORIGIN: http://localhost:${AALI_WEB_PORT:-5174}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${AALI_DB_NAME:-aali_ai}
      MYSQL_USER: ${AALI_DB_USER:-aali_dev}
      MYSQL_PASSWORD: ${AALI_DB_PASSWORD:-aali-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${AALI_DB_ROOT_PASSWORD:-aali-local-root-password}
    ports:
      - "${AALI_API_PORT:-3002}:3001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/readiness').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aali-ai-web
    restart: unless-stopped
    ports:
      - "${AALI_WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smpp-gateway:
    image: node:20-alpine
    container_name: aali-ai-smpp-gateway
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./packages/smpp-gateway:/app
    environment:
      SMPP_PORT: 2775
      HTTP_ADMIN_PORT: 2776
      API_ENDPOINT: http://api:3001/api/v1/gateway/sms
      EMERGENCY_SHORTCODE: "1090"
    ports:
      - "2775:2775"
      - "2776:2776"
    command: ["node", "server.js"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  aali_mysql_data:
