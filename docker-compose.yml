services:
  mysql:
    image: mysql:8.4
    container_name: aali-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aali_ai}
      MYSQL_USER: ${MYSQL_USER:-aali_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-local-root-password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - aali_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-this-local-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  aali_mysql_data:
