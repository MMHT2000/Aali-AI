<style>

      html, body {

        margin: 0;

      }

<!-- Android 14 System Status Bar -->
<header class="w-full pt-2 px-6 flex items-center justify-between text-xs font-medium tracking-tight text-on-surface dark:text-dark-on-surface select-none z-50">
<span class="font-semibold text-sm">10:00</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[17px] leading-none">wifi</span>

</div>
</header>
<!-- Material 3 Top App Bar -->
<div class="w-full px-4 pt-2 pb-3 flex items-center justify-between z-40">
<div class="flex items-center gap-1.5">
<button aria-label="Navigate back" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant dark:text-dark-on-surface-variant hover:bg-surface-container-high dark:hover:bg-[#272b2c] active:bg-surface-variant dark:active:bg-[#323637] transition-colors" type="button">

</button>
<div class="flex items-center gap-1.5 pl-0.5">
<span class="material-symbols-outlined text-primary dark:text-[#85d2e0] text-[26px]">flood</span>
<span class="font-headline-sm text-lg font-bold tracking-tight text-on-surface dark:text-dark-on-surface">Aali</span>
</div>
</div>
<!-- Right Controls: Status badge, Language selector & Dark Mode toggle -->
<div class="flex items-center gap-2">
<!-- M3 Online/Offline Status Pill Badge -->
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container dark:bg-[#1c2122] border border-outline-variant/40 dark:border-white/10 text-on-surface dark:text-dark-on-surface shadow-xs">
<span class="w-2 h-2 rounded-full bg-emerald-600 dark:bg-emerald-400 animate-pulse"></span>
<span class="text-[12px] font-medium leading-none tracking-tight">Online</span>
</div>
<!-- Language Toggle Switcher -->
<button class="h-8 px-2.5 rounded-full bg-surface-container dark:bg-[#1c2122] border border-outline-variant/40 dark:border-white/10 text-xs font-semibold flex items-center gap-1 text-on-surface dark:text-dark-on-surface active:scale-95 transition-transform shadow-xs" id="lang-btn" type="button">
<span class="text-primary dark:text-[#85d2e0] font-bold">EN</span>
<span class="text-outline dark:text-dark-outline text-[10px]">|</span>
<span class="text-on-surface-variant dark:text-dark-on-surface-variant">বাং</span>
</button>
<!-- M3 Dark Mode Toggle Button -->
<button aria-label="Toggle theme mode" class="w-9 h-9 rounded-full flex items-center justify-center bg-surface-container dark:bg-[#1c2122] border border-outline-variant/40 dark:border-white/10 text-on-surface dark:text-dark-on-surface hover:bg-surface-container-high dark:hover:bg-[#272b2c] active:scale-90 transition-all shadow-xs" id="theme-toggle" type="button">
<span class="material-symbols-outlined text-[20px]" id="theme-icon">dark_mode</span>
</button>
</div>
</div>
<!-- Resident Hero Section -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-3 w-full max-w-md mx-auto">
<div class="w-full flex flex-col items-center gap-5 my-auto">
<!-- Primary Emergency SOS Card (M3 Error Container, elevation-2, rounded-[28px]) -->
<div class="w-full bg-secondary dark:bg-[#93000a] text-on-secondary dark:text-[#ffdad6] rounded-[28px] p-6 shadow-md hover:shadow-lg active:scale-[0.98] transition-all cursor-pointer relative overflow-hidden group">
<!-- Ambient decorative pulse ring -->

<button class="w-full flex flex-col items-center text-center gap-3 bg-transparent border-0 focus:outline-none cursor-pointer" type="button">
<!-- Emergency Beacon Pill -->
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/20 dark:bg-white/10 backdrop-blur-sm text-white dark:text-[#ffdad6] text-xs font-semibold tracking-wider uppercase">
<span class="material-symbols-outlined text-[16px] animate-ping">emergency</span>
<span>Emergency SOS</span>
</div>
<!-- Main SOS Text -->
<div class="flex items-center justify-center gap-2.5 mt-1">

              Need help now

<!-- Bengali Translation -->
<p class="text-xl sm:text-[22px] font-semibold text-white/95 dark:text-[#ffdad6]/90 font-headline-md tracking-normal -mt-0.5">
            এখনই সাহায্য দরকার
          </p>
<!-- Prompt note -->
<div class="mt-2 pt-3 border-t border-white/20 dark:border-white/10 w-full flex items-center justify-center gap-1.5 text-xs font-medium text-white/90 dark:text-[#ffdad6]/80">
<span class="material-symbols-outlined text-[18px]">touch_app</span>
<span>Tap to request instant rescue or aid</span>
</div>
</button>
</div>

<div class="w-full bg-[#f2f4f5] dark:bg-[#181d1e] border border-outline-variant/40 dark:border-white/5 rounded-2xl p-4 shadow-xs">
<div class="flex items-start gap-3">
<div class="w-9 h-9 rounded-full bg-surface-container-highest dark:bg-[#272b2c] flex items-center justify-center text-primary dark:text-[#85d2e0] shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[20px]">cloud_off</span>
</div>
<div class="flex-1 text-left">
<div class="flex items-center justify-between gap-1 mb-0.5">
<span class="text-sm font-semibold text-on-surface dark:text-dark-on-surface font-label-lg">Works offline</span>

</div>
<p class="text-xs text-on-surface-variant dark:text-dark-on-surface-variant leading-relaxed">

            </p>
</div>
</div>
</div>
</div>

</a>
</div>
</main>
<!-- Android 14 Gesture Navigation Bar -->
<footer class="w-full flex items-center justify-center pb-2.5 pt-1 select-none pointer-events-none">
<div class="w-28 h-1 rounded-full bg-[#191c1d]/40 dark:bg-white/40"></div>
</footer>
<!-- Theme Toggle & Lang Script -->
<script>
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const htmlEl = document.documentElement;

    function applyTheme(isDark) {
      if (isDark) {
        htmlEl.classList.add('dark');
        themeIcon.textContent = 'light_mode';
      } else {
        htmlEl.classList.remove('dark');
        themeIcon.textContent = 'dark_mode';
      }
    }

    // Initialize based on saved preference or system theme
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialDark = savedTheme ? savedTheme === 'dark' : systemPrefersDark;
    applyTheme(initialDark);

    themeBtn.addEventListener('click', () => {
      const isCurrentlyDark = htmlEl.classList.contains('dark');
      const newDark = !isCurrentlyDark;
      applyTheme(newDark);
      localStorage.setItem('theme', newDark ? 'dark' : 'light');
    });
  </script>
</body></html>
